# =============================================================================
# Propósito: balanceador de carga delante de las 2 instancias de la API (sección 12; RNF-REN-03).
# Responsabilidades: recibir todo el tráfico en el puerto 80 del contenedor (8080 en el equipo),
# repartirlo entre api1 y api2, y pasar Host, la IP del cliente y X-Correlation-Id.
#
# Decisiones:
#  - Reparto round-robin (el predeterminado): la API no guarda estado entre solicitudes (las sesiones
#    son JWT, los datos están en PostgreSQL y las imágenes en un volumen compartido), así que cualquier
#    instancia puede atender cualquier solicitud.
#  - client_max_body_size 8m: MAYOR que el máximo de la API (6 MB por solicitud, 5 MB por imagen), para
#    que una imagen demasiado grande la rechace la API con su error tipado IMAGE_TOO_LARGE en el formato
#    único, y no Nginx con un 413 en HTML.
#  - X-Correlation-Id se reenvía tal cual llega: la API lo usa si es seguro o genera uno (sección 5.6).
#    Nginx ya reenvía los encabezados del cliente por defecto; se declara explícito para que la decisión
#    quede escrita.
#  - X-Upstream-Instance en la respuesta indica qué instancia atendió (dirección de api1 o api2): sirve
#    para comprobar que el balanceo funciona. Solo expone una IP de la red interna de Docker.
# =============================================================================

events {}

http {
    upstream pokearena_api {
        server api1:8080;
        server api2:8080;
    }

    server {
        listen 80;

        client_max_body_size 8m;

        location / {
            proxy_pass http://pokearena_api;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;

            add_header X-Upstream-Instance $upstream_addr always;

            # Si una instancia no responde al conectar, Nginx prueba la otra.
            proxy_next_upstream error timeout;
            proxy_connect_timeout 5s;
        }
    }
}
