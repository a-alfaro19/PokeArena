# Configuración de PokéArena. Cada valor se puede reemplazar con una variable de entorno
# (sección 12); los valores después de ":" son solo para desarrollo local.
# Este archivo no contiene secretos.
spring.application.name=pokearena

# Conexión a PostgreSQL. La contraseña no tiene valor por defecto: se entrega siempre por
# la variable de entorno DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pokearena}
spring.datasource.username=${DB_USERNAME:pokearena}
spring.datasource.password=${DB_PASSWORD:}

# Flyway es la única vía para crear y cambiar el esquema (sección 6): aplica
# classpath:db/migration al arrancar. No se usa spring.sql.init ni schema.sql.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Peso máximo de una imagen (5 MB, criterios C.1 y C.2). El multipart rechaza un archivo mayor
# antes de leerlo completo, y ApiErrorHandler lo informa como IMAGE_TOO_LARGE.
app.images.max-file-size=5MB
spring.servlet.multipart.max-file-size=${app.images.max-file-size}
# Carpeta raíz de las imágenes guardadas: en Docker Compose es el volumen compartido por las 2
# instancias (sección 9). Dentro se crean carpetas con nombres generados por el servidor.
app.images.root-dir=${APP_IMAGES_ROOT_DIR:./data/images}
# Máximo de píxeles (ancho x alto) que se acepta decodificar. Un archivo de pocos KB puede declarar
# dimensiones enormes y agotar la memoria; 16 millones de píxeles son 64 MB en memoria (RGBA).
app.images.max-pixels=16000000
# Reintentos de la miniatura antes de pasar a FAILED (sección 7.1): ThumbnailRetryJob hace un intento
# por entidad en cada ejecución, y al llegar a este número la entidad queda FAILED y no disponible.
app.images.max-retries=3
# Cada cuánto corre la tarea de reintentos de miniaturas (formato ISO-8601: PT1M es 1 minuto). Se
# cuenta desde que termina la ejecución anterior. Con 3 reintentos, una miniatura que no se puede
# generar pasa a FAILED en unos 3 minutos; el administrador ve el estado en la ficha y en la búsqueda.
app.images.retry-interval=PT1M
# Toda la solicitud: la imagen más los campos de texto del formulario.
spring.servlet.multipart.max-request-size=6MB
# El multipart se lee de forma diferida: recién cuando el controlador pide sus campos, DESPUÉS de
# que el interceptor de autorización aceptó la solicitud. Así un cliente sin credenciales recibe 401
# (y uno sin el rol, 403) aunque envíe un archivo de más de 5 MB: no obtiene nada distinto (7.1).
spring.servlet.multipart.resolve-lazily=true
# Cuánto del cuerpo rechazado lee y descarta Tomcat antes de responder. Cuando una solicitud
# supera el límite, Tomcat deja de procesarla, pero el cliente sigue enviando el resto. Si ese
# resto pasa de este valor (2MB por defecto), Tomcat corta la conexión y el cliente ve un error
# de red en lugar del IMAGE_TOO_LARGE. Por eso debe ser mayor que max-request-size: así un
# archivo demasiado grande (hasta este tamaño) recibe el error completo. Sigue siendo un tope:
# un cuerpo aún mayor se corta, para no obligar al servidor a leer envíos sin límite.
server.tomcat.max-swallow-size=20MB

# Credenciales propias de PokéArena (sección 5.2). El secreto de firma no tiene valor por
# defecto: si APP_JWT_SECRET falta o tiene menos de 32 bytes, la aplicación no arranca.
app.security.jwt-secret=${APP_JWT_SECRET:}
app.security.access-token-ttl=15m

# Largo máximo del encabezado Idempotency-Key (sección 5.4). Una clave más larga es INVALID_FIELD.
app.idempotency.max-key-length=255

# Identidades que reciben el rol ADMIN, separadas por comas, con el formato proveedor:sub (por
# ejemplo google:1234567890). El resto de las cuentas recibe PLAYER. El rol se recalcula en cada
# ingreso: quien entra o sale de la lista cambia de rol en su siguiente inicio de sesión.
app.admin.identities=${APP_ADMIN_IDENTITIES:}

# Inicio de sesión con Google (sección 8.1). La audiencia de cada token debe ser este client id
# (no es un secreto, pero depende del proyecto de Google). Sin él, Google queda deshabilitado
# (UNSUPPORTED_PROVIDER) y la aplicación arranca igual.
app.identity.google.client-id=${APP_GOOGLE_CLIENT_ID:}
# Llaves públicas de Google (JWKS). Configurable para apuntarla a un servidor local en las pruebas.
app.identity.google.jwks-uri=${APP_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
# Tiempo máximo para obtener las llaves; si se agota, IDENTITY_PROVIDER_UNAVAILABLE (503).
app.identity.google.jwks-timeout=PT5S
# Cuánto se guardan las llaves si la respuesta no trae Cache-Control max-age (Google sí lo envía).
app.identity.google.jwks-default-ttl=PT5M
# Tiempo mínimo entre dos recargas del JWKS forzadas por un kid desconocido. El inicio de sesión es
# público: sin este límite, tokens con kid inventados provocarían descargas ilimitadas a Google. No
# afecta la primera descarga ni la recarga normal cuando vence el max-age.
app.identity.google.jwks-min-reload-interval=PT1M

# Logs estructurados en JSON (formato Elastic Common Schema), el formato predeterminado. Cada
# línea incluye las claves del MDC, entre ellas correlationId (sección 5.6). El perfil dev lo
# desactiva para leer los logs como texto (application-dev.properties).
logging.structured.format.console=ecs

# Colección inicial de un jugador nuevo (sección 8.2, criterio C.5): cartas Comunes distintas (una
# copia de cada una) y cubos. Las cartas deben alcanzar para un mazo de 12; si no, no arranca.
app.collection.initial-cards=15
app.collection.initial-cubes=1000

# Paginación única de la búsqueda del administrador y del catálogo del jugador (sección 5.5):
# tamaño de página cuando el cliente no envía limit, y el máximo que puede pedir.
app.pagination.default-limit=20
app.pagination.max-limit=100

# Caché del catálogo en Redis (sección 9). Sin REDIS_HOST la caché queda desactivada (NoCatalogCache):
# la aplicación arranca y funciona igual, consultando siempre la base. Redis nunca es la única copia de
# un dato: si falla, se ignora la caché.
# app.cache.redis-host decide si se usa Redis. spring.data.redis.host conserva localhost cuando falta,
# porque Spring Boot no admite un host vacío; esa conexión es perezosa y sin REDIS_HOST nunca se usa.
app.cache.redis-host=${REDIS_HOST:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Tiempos de espera cortos: con Redis lento o caído, una solicitud espera a lo sumo esto antes de ir a la
# base (sección 9, "Falla de Redis: nunca error").
spring.data.redis.timeout=${REDIS_TIMEOUT:250ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:250ms}
# No se usan repositorios de Spring Data Redis: solo StringRedisTemplate en infrastructure.cache.
spring.data.redis.repositories.enabled=false
# Vencimiento de cada página cacheada: cuánto puede tardar, como máximo, una carta en aparecer si una
# invalidación se pierde (criterios C.3 y C.6: "puede tardar algunos segundos").
app.cache.catalog-ttl=PT30S
# Después de una falla de Redis, cuánto tiempo no se vuelve a intentar leer ni guardar páginas: con Redis
# caído, solo una solicitud cada tanto paga el tiempo de espera.
app.cache.failure-backoff=PT5S
