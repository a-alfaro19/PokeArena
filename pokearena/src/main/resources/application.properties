spring.application.name=pokearena
spring.datasource.url=jdbc:postgresql://localhost:5432/pokearena
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# Las credenciales de simulación solo tienen efecto bajo perfiles dev/test.
pokearena.search.test-admin-token=${SEARCH_TEST_ADMIN_TOKEN:}
pokearena.search.test-user-token=${SEARCH_TEST_USER_TOKEN:}
