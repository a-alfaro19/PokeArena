# Configuración de PokéArena. Cada valor se puede reemplazar con una variable de entorno
# (sección 12); los valores después de ":" son solo para desarrollo local.
# Este archivo no contiene secretos.
spring.application.name=pokearena

# Conexión a PostgreSQL. La contraseña no tiene valor por defecto: se entrega siempre por
# la variable de entorno DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pokearena}
spring.datasource.username=${DB_USERNAME:pokearena}
spring.datasource.password=${DB_PASSWORD:}

# Flyway es la única vía para crear y cambiar el esquema (sección 6): aplica
# classpath:db/migration al arrancar. No se usa spring.sql.init ni schema.sql.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Peso máximo de una imagen (5 MB, criterios C.1 y C.2). El multipart rechaza un archivo mayor
# antes de leerlo completo, y ApiErrorHandler lo informa como IMAGE_TOO_LARGE.
app.images.max-file-size=5MB
spring.servlet.multipart.max-file-size=${app.images.max-file-size}
# Toda la solicitud: la imagen más los campos de texto del formulario.
spring.servlet.multipart.max-request-size=6MB
# Cuánto del cuerpo rechazado lee y descarta Tomcat antes de responder. Cuando una solicitud
# supera el límite, Tomcat deja de procesarla, pero el cliente sigue enviando el resto. Si ese
# resto pasa de este valor (2MB por defecto), Tomcat corta la conexión y el cliente ve un error
# de red en lugar del IMAGE_TOO_LARGE. Por eso debe ser mayor que max-request-size: así un
# archivo demasiado grande (hasta este tamaño) recibe el error completo. Sigue siendo un tope:
# un cuerpo aún mayor se corta, para no obligar al servidor a leer envíos sin límite.
server.tomcat.max-swallow-size=20MB

# Logs estructurados en JSON (formato Elastic Common Schema), el formato predeterminado. Cada
# línea incluye las claves del MDC, entre ellas correlationId (sección 5.6). El perfil dev lo
# desactiva para leer los logs como texto (application-dev.properties).
logging.structured.format.console=ecs
