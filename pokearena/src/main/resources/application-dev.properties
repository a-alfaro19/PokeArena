# Perfil dev: desarrollo local. Se activa con SPRING_PROFILES_ACTIVE=dev (ver README).
# Solo cambia lo que difiere de application.properties.

# Logs en texto legible en lugar de JSON: un valor vacío desactiva el formato estructurado.
logging.structured.format.console=
# El correlationId del MDC va junto al nivel ("INFO [id]"), para seguir una solicitud también
# en desarrollo. Se usa el patrón del nivel porque el patrón por defecto ya lo separa del resto.
logging.pattern.level=%5p [%X{correlationId:-}]

# El administrador de prueba de POST /api/v1/dev/sesiones recibe ADMIN por la misma regla que
# cualquier cuenta (sección 5.2). Va en una propiedad aparte que se SUMA a app.admin.identities: si se
# escribiera en app.admin.identities, la variable APP_ADMIN_IDENTITIES (aunque esté vacía) la reemplazaría.
app.admin.dev-identities=dev:dev-admin
